name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls "$SDK/platforms" 2>/dev/null || echo "(no platforms dir)"
          ls "$SDK/build-tools" 2>/dev/null || echo "(no build-tools dir)"
          command -v sdkmanager || echo "(sdkmanager not on PATH)"
          java -version

      - name: Ensure platform 34 (best effort)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then SDK="/usr/local/lib/android/sdk"; fi
          echo "SDK=$SDK"
          SM=""
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SM="$(command -v sdkmanager || true)"
          fi
          echo "sdkmanager: $SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK/platforms/android-34" ]; then
              "$SM" --install "platforms;android-34" "build-tools;34.0.0" || echo "install failed, AGP will try to auto-download"
            fi
          fi
          mkdir -p "$SDK/licenses"
          if [ -d "$SDK" ]; then
            echo "sdk.dir=$SDK" > local.properties
            cat local.properties
          fi

      - name: Prefetch Xposed API jar
        run: |
          mkdir -p app/libs
          curl -fsSL --retry 3 --retry-delay 2 \
            -o app/libs/api-82.jar \
            https://api.xposed.info/de/robv/android/xposed/api/82/api-82.jar \
            && echo "jar ok" || echo "prefetch failed, fallback to maven repo"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ouc-tweaker-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
